[pytest]
# test_functions.py is a manual/script-based visualization tool (per
# docs/ai/architecture.md), not an automated test module: it executes real
# model calls and opens a matplotlib GUI window at import time. Run it
# directly with `python app/test/test_functions.py` instead of via pytest.
addopts = --ignore=app/test/test_functions.py
asyncio_mode = auto
